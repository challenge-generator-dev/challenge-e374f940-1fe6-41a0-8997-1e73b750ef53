<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de gestión de órdenes en DynamoDB - CRUD completo con React" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="Gestión de Órdenes" />
    <meta property="og:description" content="Sistema de gestión de órdenes en DynamoDB" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Gestión de Órdenes</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body, #root {
        height: 100%;
        width: 100%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f8fafc;
        color: #1e293b;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0f172a;
          color: #f1f5f9;
        }
      }
      #root {
        display: flex;
        flex-direction: column;
      }
      .loading-container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        flex-direction: column;
        gap: 1rem;
      }
      .loading-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #e2e8f0;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loading-text {
        font-size: 1rem;
        color: #64748b;
      }
      .error-container {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        flex-direction: column;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
      }
      .error-icon {
        font-size: 3rem;
        color: #ef4444;
      }
      .error-message {
        font-size: 1.125rem;
        color: #dc2626;
        max-width: 400px;
      }
      .error-retry {
        padding: 0.75rem 1.5rem;
        background-color: #2563eb;
        color: white;
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
        font-size: 1rem;
        transition: background-color 0.2s;
      }
      .error-retry:hover {
        background-color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-container" aria-label="Cargando aplicación">
        <div class="loading-spinner" role="status"></div>
        <p class="loading-text">Cargando aplicación...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <div class="error-container">
        <span class="error-icon" role="img" aria-label="Error">⚠️</span>
        <p class="error-message">
          Esta aplicación requiere JavaScript para funcionar. 
          Por favor, habilite JavaScript en su navegador o utilice uno que lo soporte.
        </p>
      </div>
    </noscript>
  </body>
</html>
